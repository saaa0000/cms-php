<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrinho - Star Fitness</title>
<link rel="icon" type="jpg" href="img\logo1.jpg">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 50px;

    background:rgba(10,10,15,0.85);

    backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(255,255,255,0.08);

    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;

    text-decoration:none;
}

.logo img{
    width:170px;
    height:65px;

    border-radius:14px;

    object-fit:cover;

    box-shadow:0 0 25px rgba(128,23,199,0.5);
}

.logo h1{
    font-size:28px;
    font-weight:bold;

    background:linear-gradient(90deg,#ffffff,#b84dff);

    background-clip:text;
    -webkit-background-clip:text;

    color:transparent;
    -webkit-text-fill-color:transparent;
}

/* MENU */

.menu{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    align-items:center;
}

.menu a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.menu a:hover{
    color:#b84dff;
}

.carrinho-btn{
    background:#8017c7;
    padding:10px 18px;
    border-radius:50px;
}

/* CONTAINER */

.container{
    max-width:1300px;
    margin:auto;
    padding:140px 25px 60px;
}

.titulo{
    font-size:50px;
    margin-bottom:15px;
    color:#b84dff;
}

.subtitulo{
    color:#bbb;
    margin-bottom:40px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

/* PRODUTOS */

.produtos{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.categoria{
    background:#171717;
    border-radius:25px;
    padding:25px;
}

.categoria h2{
    margin-bottom:25px;
    color:#b84dff;
}

.item{
    background:#1f1f1f;
    border-radius:25px;
    padding:20px;

    display:flex;
    gap:20px;
    align-items:center;

    margin-bottom:20px;
}

.item img{
    width:150px;
    border-radius:20px;
    background:#222;
    padding:10px;
}

.info{
    flex:1;
}

.info h3{
    margin-bottom:10px;
}

.info p{
    color:#bbb;
    margin-bottom:8px;
}

.preco{
    color:#b84dff;
    font-size:25px;
    font-weight:bold;
}

/* QUANTIDADE */

.quantidade{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.quantidade button{
    width:35px;
    height:35px;

    border:none;
    border-radius:10px;

    background:#8017c7;
    color:white;

    font-size:20px;
    cursor:pointer;
}

.remover{
    margin-top:15px;

    background:none;
    border:none;

    color:#ff4d4d;

    font-weight:bold;

    cursor:pointer;
}

/* RESUMO */

.resumo{
    background:#1b1b1b;
    padding:30px;
    border-radius:25px;
    height:fit-content;
}

.resumo h2{
    margin-bottom:25px;
    color:#b84dff;
}

.linha{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;

    color:#ccc;
}

.total{
    font-size:30px;
    font-weight:bold;
    color:white;
}

/* CUPOM */

.cupom{
    margin-top:20px;
}

.cupom input{
    width:100%;
    padding:15px;

    border:none;
    border-radius:12px;

    background:#222;
    color:white;

    margin-bottom:15px;
}

.cupom button{
    width:100%;
    padding:15px;

    border:none;
    border-radius:50px;

    background:linear-gradient(90deg,#8017c7,#5f0fa0);

    color:white;
    font-weight:bold;

    cursor:pointer;
}

/* PAGAMENTO */

.pagamentos{
    margin-top:30px;
}

.pagamentos h3{
    margin-bottom:15px;
    color:#b84dff;
}

.opcao{
    background:#222;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.opcao label{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    font-weight:bold;
}

.cartao-info{
    margin-top:15px;
    display:none;
}

.cartao-info input{
    width:100%;
    padding:14px;
    margin-bottom:12px;

    border:none;
    border-radius:12px;

    background:#2a2a2a;
    color:white;
}

.pix-box,
.boleto-box{
    display:none;

    margin-top:15px;

    background:#2a2a2a;

    padding:15px;

    border-radius:15px;
}

.pix-chave{
    word-break:break-all;
    color:#00ff88;
    font-weight:bold;
    margin-top:10px;
}

.desconto{
    color:#00ff88;
    font-weight:bold;
}

/* BOTÕES */

.finalizar{
    width:100%;

    margin-top:30px;

    padding:18px;

    border:none;
    border-radius:50px;

    background:linear-gradient(90deg,#8017c7,#5f0fa0);

    color:white;

    font-weight:bold;

    cursor:pointer;

    font-size:18px;
}

.continuar{
    display:block;
    text-align:center;

    margin-top:15px;

    color:#bbb;
    text-decoration:none;
}

/* FOOTER */

footer{
    margin-top:80px;

    background:#0a0a0a;
    padding:30px;

    text-align:center;
    color:#888;
}

/* RESPONSIVO */

@media(max-width:950px){

    .grid{
        grid-template-columns:1fr;
    }

    .item{
        flex-direction:column;
        text-align:center;
    }

    .item img{
        width:100%;
        max-width:300px;
    }

    header{
        flex-direction:column;
        gap:15px;
    }

    .menu{
        justify-content:center;
    }
}

</style>

</head>

<body>

<header>

    <a href="Academia.html" class="logo">

        <img src="Z:\academia\academia\img\Logo2.jpg">

        <h1>Star Fitness</h1>

    </a>

    <div class="menu">

        <a href="Academia.html">Início</a>
        <a href="planos.html">Planos</a>
        <a href="treinos.html">Treinos</a>
        <a href="contato.html">Contato</a>
        <a href="sobre.html">Sobre</a>

        <a href="carrinho.html" class="carrinho-btn">
             Carrinho
        </a>

    </div>

</header>

<div class="container">

    <h1 class="titulo">
        Seu Carrinho
    </h1>

    <p class="subtitulo">
        Escolha sua forma de pagamento e finalize sua compra.
    </p>

    <div id="conteudo-carrinho"></div>

</div>

<footer>

    © 2026 Star Fitness

</footer>



</body>
</html>
